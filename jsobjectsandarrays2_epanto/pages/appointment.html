<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>[jsobjectsandarrays2] - epanto</title>
    <link rel="shortcut icon" href="../assets/logo.png" type="image/x-icon" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <!-- Modal -->
    <div
      class="modal fade"
      id="pageModal"
      tabindex="-1"
      aria-labelledby="pageModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div
          class="modal-content glassmorphism"
          style="background-color: #0a0a0a; width: auto; min-width: 500px"
        >
          <div
            class="modal-header"
            style="border-color: rgba(255, 255, 255, 0.127)"
          >
            <h1
              class="modal-title fs-5 custom-text-primary"
              id="pageModalLabel"
            >
              Patient List
            </h1>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body custom-text-secondary"">
            <table class="table table-hover table-dark">
              <thead>
                <tr>
                  <th scope="col">#</th>
                  <th scope="col">Name</th>
                  <th scope="col">Date</th>
                  <th scope="col">Time</th>
                  <th scope="col">Status</th>
                </tr>
              </thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>
          <div
            class="modal-footer"
            style="border-color: rgba(255, 255, 255, 0.127)"
          >
            <button
              type="button"
              class="btn btn-outline-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>
    <main
      class="container-fluid d-flex justify-content-center align-items-center flex-column"
      style="height: 100vh; width: 100vw"
    >
      <a
        href="../index.html"
        class="btn glassmorphism btn-outline-secondary mb-2 custom-text-secondary"
        ><i class="bi bi-arrow-left"></i> Go Back</a
      >
      <div
        class="card w-100 p-2 m-2 glassmorphism custom-text-secondary"
        style="height: auto; max-width: 520px"
      >
        <div class="card-header">
          <i class="bi bi-calendar fs-1"></i>
          <h1 class="custom-text-primary m-0">Appointment-er</h1>
          <p>An appointment scheduler...</p>
          <hr />
        </div>
        <div class="card-body d-flex flex-column gap-1 py-0">
          <form onsubmit="appointmentScheduler(event)">
            <div class="mb-3">
              <label for="nameInput" class="form-label">Patient Name</label>
              <input
                type="text"
                class="form-control border border-secondary text-light"
                style="background-color: rgba(255, 255, 255, 0.078)"
                id="nameInput"
                required
              />
            </div>
            <div class="mb-3 d-flex gap-2">
              <div class="w-50">
                <label for="dateInput" class="form-label"
                  >Appointment Date</label
                >
                <input
                  type="date"
                  class="form-control border border-secondary text-light"
                  style="background-color: rgba(255, 255, 255, 0.078)"
                  id="dateInput"
                  required
                />
              </div>
              <div class="w-50">
                <label for="timeInput" class="form-label"
                  >Appointment Time</label
                >
                <input
                  type="time"
                  class="form-control border border-secondary text-light"
                  style="background-color: rgba(255, 255, 255, 0.078)"
                  id="timeInput"
                  required
                />
              </div>
            </div>
            <div class="mb-3">
              <label for="statusInput" class="form-label">Select Status</label>
              <select
                id="statusInput"
                class="form-select border border-secondary text-light"
                style="background-color: rgba(255, 255, 255, 0.078)"
                required
              >
                <option selected></option>
                <option value="Regular">Regular</option>
                <option value="Priority">Priority</option>
                <option value="Emergency">Emergency</option>
              </select>
            </div>
            <button
              type="submit"
              class="btn btn-outline-secondary custom-text-primary w-100 mt-4"
            >
              Submit
            </button>
            <!-- Button trigger modal -->
            <button
              type="button"
              class="btn border border-secondary custom-text-primary w-100 mt-1"
              style="background-color: rgba(255, 255, 255, 0.315)"
              data-bs-toggle="modal"
              data-bs-target="#pageModal"
            >
              View All Patients
            </button>
          </form>
        </div>
        <div class="card-footer">
          <hr />
          <div
            class="d-flex flex-column flex-md-row justify-content-between"
            style="font-size: smaller"
          >
            <p class="w-75">© 2025, Gian Epanto. All Rights Reserved.</p>
            <div
              class="d-flex w-25 justify-content-end gap-2 fs-6"
              style="line-height: 0"
            >
              <a
                href="https://github.com/gian-gg"
                class="custom-text-secondary custom-btn-hover"
                target="_blank"
                ><i class="bi bi-github"></i
              ></a>
              <a
                href="https://www.linkedin.com/in/gian-gg"
                class="custom-text-secondary custom-btn-hover"
                target="_blank"
                ><i class="bi bi-linkedin"></i
              ></a>
              <a
                href="https://www.facebook.com/epanto.gg/"
                class="custom-text-secondary custom-btn-hover"
                target="_blank"
                ><i class="bi bi-facebook"></i
              ></a>
              <a
                href="https://www.instagram.com/gian.gg_/"
                class="custom-text-secondary custom-btn-hover"
                target="_blank"
                ><i class="bi bi-instagram"></i
              ></a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
      defer
    ></script>
    <script src="../scripts/appointment.js"></script>
  </body>
</html>
