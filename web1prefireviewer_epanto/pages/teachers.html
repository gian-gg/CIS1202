<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web1prefireviewer_epanto</title>
    <link rel="shortcut icon" href="../assets/logo.png" type="image/x-icon" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main
      class="container-fluid d-flex align-items-center flex-column"
      style="min-height: 100vh; min-width: 100vw"
    >
      <a
        href="../index.html"
        class="btn glassmorphism btn-outline-secondary mb-4 custom-text-secondary mt-5"
        style="width: 128px"
        ><i class="bi bi-arrow-left"></i> Go Back</a
      >
      <div
        class="card w-100 p-2 mb-5 glassmorphism custom-text-secondary"
        style="max-width: 860px"
      >
        <div class="card-header">
          <i class="bi bi-person-lines-fill fs-1"></i>
          <h1 class="custom-text-primary m-0">Teachers List</h1>
          <p>The school admin wants to dynamically list teachers’ names and subjects from teachers.json. Display and present fetched data on an HTML page</p>
          <hr />
        </div>
        <div
          class="card-body d-flex flex-column gap-4 py-0"
          style="height: auto"
        >
          <button
            onclick="loadData()"
            class="btn btn-outline-secondary custom-text-primary container-fluid"
          >
            Load Teachers
          </button>
          <table class="table table-hover table-dark">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Name</th>
                <th scope="col">Subject</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <tr>
                <td colspan="4" class="text-center">
                  Click button to load courses!
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="card-footer">
          <hr />
          <div
            class="d-flex flex-column flex-md-row justify-content-between"
            style="font-size: smaller"
          >
            <p class="w-75">© 2025, Gian Epanto. All Rights Reserved.</p>
            <div
              class="d-flex w-25 justify-content-end gap-2 fs-6"
              style="line-height: 0"
            >
              <a
                href="https://github.com/gian-gg"
                class="custom-text-secondary custom-btn-hover"
                target="_blank"
                ><i class="bi bi-github"></i
              ></a>
              <a
                href="https://www.linkedin.com/in/gian-gg"
                class="custom-text-secondary custom-btn-hover"
                target="_blank"
                ><i class="bi bi-linkedin"></i
              ></a>
              <a
                href="https://www.facebook.com/epanto.gg/"
                class="custom-text-secondary custom-btn-hover"
                target="_blank"
                ><i class="bi bi-facebook"></i
              ></a>
              <a
                href="https://www.instagram.com/gian.gg_/"
                class="custom-text-secondary custom-btn-hover"
                target="_blank"
                ><i class="bi bi-instagram"></i
              ></a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
      defer
    ></script>

    <script src="../script/teachers.js"></script>
  </body>
</html>
